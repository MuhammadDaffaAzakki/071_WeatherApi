<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation API</title>
    
</head>
<body>

    <div class="card">
        <div class="identity">
            <h3>Muhammad Daffa Azakki</h3>
            <h3>20240140071</h3>
        </div>
        
        <div class="input-group">
            <input type="text" id="inputLokasi" placeholder="Masukkan lokasi (cth: Yogyakarta)...">
            <button onclick="cariLokasi()">Cari</button>
        </div>

        <div class="result">
            <div class="result-item">
                <span class="result-label">Lokasi</span>
                <span class="result-value" id="resLokasi">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Negara</span>
                <span class="result-value" id="resNegara">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Provinsi</span>
                <span class="result-value" id="resProvinsi">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Kecamatan</span>
                <span class="result-value" id="resKecamatan">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Longitude</span>
                <span class="result-value" id="resLongitude">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Latitude</span>
                <span class="result-value" id="resLatitude">-</span>
            </div>
        </div>
    </div>
